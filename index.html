<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F87505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Classroom">

    <title>Classroom</title>

    <link rel="icon" type="image/png" sizes="96x96" href="favicon-BVSVfY-O.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">

    <style>
        :root {
            --orange-top: #FC9101;
            --orange-mid: #F87505;
            --orange-bottom: #F45D06;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 50% 30%, rgba(255, 168, 0, 0.18), transparent 38%),
                linear-gradient(145deg, var(--orange-top) 0%, var(--orange-mid) 48%, var(--orange-bottom) 100%);
            color: var(--white);
            font-family:
                "SF Pro Display",
                "SF Pro Text",
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .loader-screen {
            width: min(100vw, 100vh);
            min-width: 280px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            text-align: center;
        }

        .loader {
            position: relative;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            filter: drop-shadow(0 8px 24px rgba(120, 47, 0, 0.16));
        }

        .loader::before {
            content: "";
            position: absolute;
            inset: 0;
            border: 6px solid rgba(255, 255, 255, 0.28);
            border-radius: 50%;
        }

        .loader::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 6px solid transparent;
            border-top-color: #FFFFFF;
            border-right-color: #FFFFFF;
            border-radius: 50%;
            transform: rotate(-18deg);
            animation: spin 0.9s linear infinite;
        }

        .loader-core {
            position: absolute;
            inset: 19px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.98);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.2),
                0 5px 16px rgba(115, 44, 0, 0.14);
            animation: pulse 1.35s ease-in-out infinite;
        }

        .loading-text {
            margin: 0;
            color: #FFFFFF;
            font-size: clamp(20px, 3vw, 27px);
            font-weight: 600;
            letter-spacing: -0.025em;
            line-height: 1;
        }

        @keyframes spin {
            to {
                transform: rotate(342deg);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(0.92);
                opacity: 0.82;
            }
            50% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .loader::after,
            .loader-core {
                animation-duration: 2.5s;
            }
        }
    </style>
</head>
<body>
    <main class="loader-screen" aria-label="Ladevorgang">
        <div class="loader" aria-hidden="true">
        </div>
        <p class="loading-text">Bitte warten</p>
    </main>
</body>
</html>
